<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Satstreamr</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#10d9a0" />
    <meta name="description" content="Satstreamr lets streamers earn Bitcoin (via Cashu) per minute while streaming video. No Lightning routing — just bearer tokens sent over a WebRTC data channel." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Satstreamr" />
    <meta property="og:description" content="Earn sats per minute streaming video. Cashu tokens flow directly over WebRTC — no routing, no accounts." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Satstreamr" />
    <meta name="twitter:description" content="Earn sats per minute streaming video. Cashu tokens flow directly over WebRTC — no routing, no accounts." />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Satstreamr",
      "applicationCategory": "MultimediaApplication",
      "operatingSystem": "Web",
      "description": "Peer-to-peer video streaming with per-minute Cashu micropayments over a WebRTC data channel. Self-hostable on Umbrel.",
      "featureList": [
        "WebRTC video streaming",
        "Cashu ecash micropayments",
        "Lightning Network deposit and withdrawal",
        "Self-hostable"
      ]
    }
    </script>
    <link rel="stylesheet" href="/src/styles/design-tokens.css" />
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
      }

      html {
        -webkit-font-smoothing: antialiased;
      }

      body {
        font-family: var(--font-ui);
        max-width: 560px;
        margin: var(--space-12) auto;
        padding: 0 var(--space-6);
        color: var(--color-text-primary);
        background: var(--color-bg-base);
        min-height: 100vh;
        background-image:
          radial-gradient(ellipse 80% 60% at 0% 0%, rgba(247,147,26,0.08) 0%, transparent 60%),
          radial-gradient(ellipse 50% 40% at 100% 100%, rgba(124,58,237,0.07) 0%, transparent 50%);
      }

      h1 {
        font-size: 1.75rem;
        font-weight: 800;
        margin: 0 0 0.25rem;
        background: var(--gradient-brand);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .tagline {
        color: var(--color-text-secondary);
        font-size: 0.95rem;
        margin: 0 0 var(--space-8);
      }

      /* ---- Wallet widget ---- */
      #wallet-widget {
        position: relative;
        background: var(--glass-bg);
        border: 1px solid var(--color-border-accent);
        border-radius: var(--radius-lg);
        padding: 1.5rem 1.75rem;
        margin-bottom: var(--space-8);
        box-shadow: var(--shadow-glow-bitcoin);
        overflow: hidden;
      }

      #wallet-widget::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: var(--gradient-brand);
      }

      .wallet-label {
        font-size: var(--text-xs);
        font-weight: 500;
        color: var(--color-text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: var(--space-2);
      }

      #balance-display {
        font-family: var(--font-mono);
        font-size: var(--text-4xl);
        font-weight: 700;
        color: var(--color-text-accent);
        line-height: 1.2;
        margin-bottom: var(--space-5);
        letter-spacing: -0.02em;
      }

      .wallet-actions {
        display: flex;
        gap: var(--space-3);
      }

      .wallet-btn {
        padding: 0.4rem 0.9rem;
        border: 1px solid var(--color-border-accent);
        border-radius: var(--radius-sm);
        background: transparent;
        color: var(--color-text-accent);
        font-size: var(--text-sm);
        font-weight: 600;
        font-family: var(--font-ui);
        cursor: pointer;
        transition: background var(--duration-fast) ease, color var(--duration-fast) ease, border-color var(--duration-fast) ease;
      }

      .wallet-btn:hover {
        background: var(--color-bitcoin);
        color: #fff;
        border-color: var(--color-bitcoin);
      }

      /* ---- Token denomination breakdown ---- */
      #token-details-wrapper {
        margin-bottom: var(--space-8);
      }

      #token-details-toggle {
        background: none;
        border: none;
        padding: 0;
        font-size: var(--text-xs);
        color: var(--color-text-muted);
        text-decoration: underline;
        cursor: pointer;
        display: block;
        margin-bottom: var(--space-2);
        font-family: var(--font-ui);
        transition: color var(--duration-fast) ease;
      }

      #token-details-toggle:hover {
        color: var(--color-text-secondary);
      }

      #token-details-panel {
        display: none;
        background: var(--glass-bg);
        border: 1px solid var(--color-border-subtle);
        border-radius: var(--radius-md);
        padding: 0.9rem var(--space-4);
      }

      #token-details-panel.is-open {
        display: block;
      }

      #token-details-table {
        width: 100%;
        border-collapse: collapse;
        font-family: var(--font-mono);
        font-size: var(--text-sm);
        margin-bottom: var(--space-3);
      }

      #token-details-table th {
        text-align: left;
        color: var(--color-text-secondary);
        font-weight: 600;
        font-size: var(--text-xs);
        padding: 0.2rem var(--space-2) 0.4rem;
        border-bottom: 1px solid var(--color-border-subtle);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      #token-details-table th:nth-child(2),
      #token-details-table th:nth-child(3) {
        text-align: right;
      }

      #token-details-table td {
        padding: 0.25rem var(--space-2);
        vertical-align: middle;
        color: var(--color-text-secondary);
      }

      #token-details-table td:nth-child(2),
      #token-details-table td:nth-child(3) {
        text-align: right;
      }

      #token-details-table tbody tr:hover {
        background: var(--color-bg-overlay);
      }

      #token-details-summary {
        font-family: var(--font-mono);
        font-size: var(--text-sm);
        font-weight: 700;
        color: var(--color-text-primary);
        border-top: 1px solid var(--color-border-subtle);
        padding-top: var(--space-2);
        margin-top: var(--space-1);
      }

      /* ---- Section cards ---- */
      .section-card {
        background: var(--glass-bg);
        border: 1px solid var(--color-border-subtle);
        border-radius: var(--radius-lg);
        padding: 1.25rem var(--space-6);
        margin-bottom: 1.25rem;
        box-shadow: var(--shadow-card);
        transition: transform var(--duration-normal) var(--ease-out), box-shadow var(--duration-normal) ease;
      }

      .section-card:hover {
        transform: translateY(-3px);
        box-shadow: var(--shadow-card), 0 0 0 1px rgba(247,147,26,0.08);
      }

      .section-card h2 {
        font-size: var(--text-lg);
        font-weight: 600;
        margin: 0 0 var(--space-3);
        color: var(--color-text-primary);
      }

      .section-card p {
        font-size: var(--text-sm);
        color: var(--color-text-secondary);
        margin: 0 0 var(--space-4);
      }

      /* ---- Buttons ---- */
      .btn-primary {
        position: relative;
        display: inline-block;
        padding: 0.55rem 1.4rem;
        background: var(--gradient-brand);
        color: #fff;
        border: none;
        border-radius: var(--radius-md);
        font-size: var(--text-base);
        font-weight: 600;
        font-family: var(--font-ui);
        cursor: pointer;
        overflow: hidden;
        box-shadow: var(--shadow-glow-bitcoin);
        transition: transform var(--duration-fast) var(--ease-out), box-shadow var(--duration-fast) ease;
      }

      .btn-primary::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.15) 50%, transparent 100%);
        transform: translateX(-100%);
        transition: transform var(--duration-slow) ease;
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 0 32px rgba(247,147,26,0.55), 0 0 12px rgba(247,147,26,0.3);
      }

      .btn-primary:hover::after {
        transform: translateX(100%);
      }

      .btn-primary:active {
        transform: scale(0.97);
        box-shadow: var(--shadow-glow-bitcoin);
      }

      .btn-primary:focus-visible {
        outline: 2px solid var(--color-bitcoin);
        outline-offset: 3px;
      }

      .btn-primary:disabled {
        opacity: 0.35;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      /* ---- Join form ---- */
      #join-form {
        display: flex;
        gap: var(--space-2);
        flex-wrap: wrap;
      }

      #session-id-input {
        flex: 1;
        min-width: 0;
        padding: var(--space-2) var(--space-3);
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--color-border-subtle);
        border-radius: var(--radius-sm);
        font-size: 0.95rem;
        font-family: var(--font-mono);
        color: var(--color-text-primary);
        transition: border-color var(--duration-fast) ease, box-shadow var(--duration-fast) ease;
      }

      #session-id-input::placeholder {
        color: var(--color-text-muted);
      }

      #session-id-input:focus {
        outline: none;
        border-color: var(--color-border-accent);
        box-shadow: 0 0 0 3px rgba(247,147,26,0.12);
      }

      #join-error {
        display: none;
        margin-top: var(--space-2);
        font-size: var(--text-sm);
        color: var(--color-error);
      }

      /* ---- Invite preview panel ---- */
      #invite-panel {
        display: none;
        background: var(--glass-bg);
        border: 1px solid rgba(240, 196, 25, 0.25);
        border-left: 3px solid var(--color-warning);
        border-radius: var(--radius-lg);
        padding: 1.25rem var(--space-6);
        margin-bottom: 1.25rem;
      }

      #invite-panel h2 {
        font-size: var(--text-lg);
        margin: 0 0 var(--space-3);
        color: var(--color-warning);
        font-weight: 600;
      }

      #invite-panel p {
        font-size: var(--text-sm);
        color: rgba(240, 196, 25, 0.6);
        margin: 0 0 var(--space-3);
      }

      #invite-json {
        background: var(--color-bg-surface);
        border: 1px solid var(--color-border-subtle);
        border-radius: var(--radius-sm);
        padding: var(--space-3);
        font-size: 0.88rem;
        font-family: var(--font-mono);
        color: var(--color-text-secondary);
        word-break: break-all;
        margin: 0 0 0.25rem;
        line-height: 1.7;
      }

      #invite-decode-error {
        display: none;
        font-size: var(--text-sm);
        color: var(--color-error);
        margin-bottom: var(--space-3);
      }

      /* ---- Withdraw panel ---- */
      #withdraw-panel {
        display: none;
        background: var(--glass-bg);
        border: 1px solid rgba(124, 58, 237, 0.3);
        border-left: 3px solid var(--color-electric);
        border-radius: var(--radius-lg);
        padding: 1.25rem var(--space-6);
        margin-bottom: 1.25rem;
      }

      #withdraw-panel h2 {
        font-size: var(--text-lg);
        margin: 0 0 var(--space-3);
        color: var(--color-electric);
        font-weight: 600;
      }

      #withdraw-invoice-input {
        width: 100%;
        padding: 0.6rem var(--space-3);
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(124, 58, 237, 0.35);
        border-radius: var(--radius-sm);
        font-family: var(--font-mono);
        font-size: var(--text-sm);
        color: var(--color-text-primary);
        resize: vertical;
        min-height: 4.5rem;
        margin-bottom: var(--space-3);
        box-sizing: border-box;
        transition: border-color var(--duration-fast) ease, box-shadow var(--duration-fast) ease;
      }

      #withdraw-invoice-input::placeholder {
        color: var(--color-text-muted);
      }

      #withdraw-invoice-input:focus {
        outline: none;
        border-color: rgba(124, 58, 237, 0.65);
        box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
      }

      #withdraw-status {
        display: none;
        font-size: var(--text-sm);
        margin-bottom: var(--space-3);
        padding: 0.6rem 0.9rem;
        border-radius: var(--radius-sm);
        overflow-wrap: break-word;
        word-break: break-all;
      }

      #withdraw-status.status-info {
        background: rgba(56, 189, 248, 0.08);
        color: var(--color-info);
        border: 1px solid rgba(56, 189, 248, 0.25);
      }

      #withdraw-status.status-success {
        background: rgba(16, 217, 160, 0.08);
        color: var(--color-success);
        border: 1px solid rgba(16, 217, 160, 0.25);
      }

      #withdraw-status.status-error {
        background: rgba(239, 68, 68, 0.08);
        color: var(--color-error);
        border: 1px solid rgba(239, 68, 68, 0.25);
      }

      #withdraw-status.status-warning {
        background: rgba(240, 196, 25, 0.08);
        color: var(--color-warning);
        border: 1px solid rgba(240, 196, 25, 0.25);
      }

      #withdraw-max-estimate {
        display: none;
        background: rgba(16, 217, 160, 0.08);
        border: 1px solid rgba(16, 217, 160, 0.25);
        border-radius: var(--radius-sm);
        padding: 0.65rem 0.9rem;
        font-size: var(--text-sm);
        margin-bottom: var(--space-3);
      }

      #withdraw-max-estimate .max-main {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-2);
        color: var(--color-success);
      }

      #withdraw-max-estimate .max-amount {
        font-family: var(--font-mono);
        font-weight: 600;
      }

      #withdraw-max-estimate .max-breakdown {
        font-size: var(--text-xs);
        color: var(--color-text-muted);
        margin-top: var(--space-1);
        font-family: var(--font-mono);
      }

      #withdraw-max-estimate .copy-amount-btn {
        padding: 0.2rem 0.5rem;
        border: 1px solid rgba(16, 217, 160, 0.35);
        border-radius: var(--radius-sm);
        background: transparent;
        color: var(--color-success);
        font-size: var(--text-xs);
        font-weight: 600;
        font-family: var(--font-ui);
        cursor: pointer;
        transition: background var(--duration-fast) ease, color var(--duration-fast) ease;
        white-space: nowrap;
      }

      #withdraw-max-estimate .copy-amount-btn:hover {
        background: var(--color-success);
        color: #fff;
      }

      .withdraw-actions {
        display: flex;
        gap: var(--space-2);
        flex-wrap: wrap;
        align-items: center;
      }

      .btn-withdraw {
        padding: 0.45rem var(--space-4);
        border: none;
        border-radius: var(--radius-sm);
        font-size: var(--text-sm);
        font-weight: 600;
        font-family: var(--font-ui);
        cursor: pointer;
        transition: background var(--duration-fast) ease, color var(--duration-fast) ease, filter var(--duration-fast) ease;
      }

      .btn-withdraw-primary {
        background: var(--color-electric);
        color: #fff;
      }

      .btn-withdraw-primary:hover:not(:disabled) {
        filter: brightness(1.2);
      }

      .btn-withdraw-primary:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }

      .btn-withdraw-secondary {
        background: transparent;
        color: var(--color-electric);
        border: 1px solid rgba(124, 58, 237, 0.5);
      }

      .btn-withdraw-secondary:hover:not(:disabled) {
        background: var(--color-electric);
        color: #fff;
      }

      .btn-withdraw-secondary:disabled {
        border-color: var(--color-text-muted);
        color: var(--color-text-muted);
        cursor: not-allowed;
      }

      .btn-withdraw-ghost {
        background: transparent;
        color: var(--color-text-secondary);
        border: 1px solid var(--color-border-default);
      }

      .btn-withdraw-ghost:hover {
        background: var(--color-bg-overlay);
        color: var(--color-text-primary);
      }

      /* ---- Deposit modal overlay ---- */
      #deposit-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(5, 7, 15, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        z-index: 100;
        align-items: center;
        justify-content: center;
      }

      #deposit-overlay.is-open {
        display: flex;
      }

      #deposit-panel {
        position: relative;
        background: var(--color-bg-elevated);
        border: 1px solid var(--color-border-default);
        border-radius: var(--radius-xl);
        padding: 1.75rem var(--space-8);
        width: min(460px, calc(100vw - 2rem));
        max-height: calc(100vh - 2rem);
        overflow-y: auto;
        box-shadow: var(--shadow-modal);
      }

      #deposit-panel h2 {
        font-size: var(--text-xl);
        font-weight: 700;
        margin: 0 0 1.25rem;
        color: var(--color-text-primary);
      }

      /* Amount row */
      #deposit-amount-row {
        display: flex;
        gap: var(--space-2);
        margin-bottom: 1.25rem;
      }

      #deposit-amount-input {
        flex: 1;
        min-width: 0;
        padding: var(--space-2) var(--space-3);
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--color-border-subtle);
        border-radius: var(--radius-sm);
        font-size: 0.95rem;
        color: var(--color-text-primary);
        font-family: var(--font-ui);
        transition: border-color var(--duration-fast) ease, box-shadow var(--duration-fast) ease;
      }

      #deposit-amount-input::placeholder {
        color: var(--color-text-muted);
      }

      #deposit-amount-input:focus {
        outline: none;
        border-color: var(--color-border-accent);
        box-shadow: 0 0 0 3px rgba(247,147,26,0.12);
      }

      #deposit-amount-input:disabled {
        background: var(--color-bg-surface);
        color: var(--color-text-muted);
        border-color: var(--color-border-default);
        cursor: not-allowed;
        opacity: 0.7;
      }

      /* Invoice display */
      #deposit-invoice-area {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: var(--space-4);
        margin-bottom: 1.25rem;
      }

      #deposit-invoice-area.is-visible {
        display: flex;
      }

      #deposit-qr-canvas {
        border: 3px solid var(--color-bitcoin);
        border-radius: var(--radius-sm);
      }

      #deposit-invoice-text {
        width: 100%;
        background: var(--color-bg-surface);
        border: 1px solid var(--color-border-subtle);
        border-radius: var(--radius-sm);
        padding: 0.6rem var(--space-3);
        font-family: var(--font-mono);
        font-size: 0.72rem;
        color: var(--color-text-secondary);
        word-break: break-all;
        white-space: pre-wrap;
        margin: 0;
        max-height: 6.5rem;
        overflow-y: auto;
      }

      #deposit-copy-btn {
        align-self: flex-end;
        padding: 0.35rem 0.8rem;
        border: 1px solid var(--color-border-accent);
        border-radius: var(--radius-sm);
        background: transparent;
        color: var(--color-text-accent);
        font-size: var(--text-sm);
        font-weight: 600;
        font-family: var(--font-ui);
        cursor: pointer;
        transition: background var(--duration-fast) ease, color var(--duration-fast) ease;
      }

      #deposit-copy-btn:hover {
        background: var(--color-bitcoin);
        color: #fff;
        border-color: var(--color-bitcoin);
      }

      /* Status area */
      #deposit-status {
        display: none;
        font-size: var(--text-sm);
        margin-bottom: var(--space-4);
        text-align: center;
        padding: 0.6rem var(--space-3);
        border-radius: var(--radius-sm);
      }

      #deposit-status.is-visible {
        display: block;
      }

      #deposit-status.is-waiting {
        color: var(--color-info);
        background: rgba(56, 189, 248, 0.08);
        border: 1px solid rgba(56, 189, 248, 0.25);
      }

      #deposit-status.is-success {
        color: var(--color-success);
        background: rgba(16, 217, 160, 0.08);
        border: 1px solid rgba(16, 217, 160, 0.25);
        font-weight: 600;
      }

      #deposit-status.is-expired {
        color: var(--color-warning);
        background: rgba(240, 196, 25, 0.08);
        border: 1px solid rgba(240, 196, 25, 0.25);
      }

      #deposit-status.is-error {
        color: var(--color-error);
        background: rgba(239, 68, 68, 0.08);
        border: 1px solid rgba(239, 68, 68, 0.25);
      }

      #deposit-reset-countdown {
        display: none;
        margin-top: calc(var(--space-2) * -1);
        margin-bottom: var(--space-4);
        text-align: center;
        font-size: var(--text-xs);
        color: var(--color-text-muted);
        opacity: 0.8;
      }

      #deposit-reset-countdown.is-visible {
        display: block;
      }

      /* Spinner */
      .deposit-spinner {
        display: inline-block;
        width: 0.85em;
        height: 0.85em;
        border: 2px solid rgba(247, 147, 26, 0.2);
        border-top-color: var(--color-bitcoin);
        border-radius: 50%;
        animation: deposit-spin 0.8s linear infinite;
        vertical-align: -0.15em;
        margin-right: 0.35em;
      }

      @keyframes deposit-spin {
        to { transform: rotate(360deg); }
      }

      /* Footer buttons */
      #deposit-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: var(--space-2);
      }

      /* ---- Session history ---- */
      #session-history-section {
        margin-top: var(--space-8);
        margin-bottom: var(--space-8);
      }

      .session-history-heading {
        font-size: var(--text-xs);
        font-weight: 500;
        color: var(--color-text-muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: var(--space-3);
      }

      #session-history-list {
        display: flex;
        flex-direction: column;
        gap: var(--space-2);
      }

      .session-history-empty {
        font-size: var(--text-sm);
        color: var(--color-text-muted);
        font-style: italic;
      }

      .session-history-row {
        display: flex;
        align-items: center;
        gap: var(--space-3);
        padding: 0.55rem var(--space-4);
        background: var(--glass-bg);
        border: 1px solid var(--color-border-subtle);
        border-radius: var(--radius-md);
        font-size: var(--text-sm);
      }

      .session-history-date {
        color: var(--color-text-muted);
        font-size: var(--text-xs);
        min-width: 3.5rem;
        flex-shrink: 0;
      }

      .session-history-badge {
        font-size: var(--text-xs);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        padding: 0.15rem 0.45rem;
        border-radius: var(--radius-full);
        flex-shrink: 0;
        min-width: 4rem;
        text-align: center;
      }

      .session-history-badge.tutor {
        background: rgba(247, 147, 26, 0.15);
        color: var(--color-bitcoin);
        border: 1px solid rgba(247, 147, 26, 0.3);
      }

      .session-history-badge.viewer {
        background: rgba(124, 58, 237, 0.15);
        color: #b496ff;
        border: 1px solid rgba(124, 58, 237, 0.3);
      }

      .session-history-duration {
        font-family: var(--font-mono);
        color: var(--color-text-secondary);
        flex-shrink: 0;
      }

      .session-history-sats {
        font-family: var(--font-mono);
        color: var(--color-text-accent);
        margin-left: auto;
        flex-shrink: 0;
      }

      /* ---- Deposit success celebration ---- */
      #deposit-success-area {
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: var(--space-8) 0;
        margin-bottom: 1.25rem;
      }

      #deposit-success-area.is-visible {
        display: flex;
      }

      #deposit-checkmark {
        opacity: 0;
        transform: scale(0.3);
      }

      #deposit-success-area.is-visible #deposit-checkmark {
        animation: deposit-check-pop var(--duration-slow) var(--ease-spring) forwards;
      }

      .checkmark-circle {
        stroke-dasharray: 227;
        stroke-dashoffset: 227;
      }

      #deposit-success-area.is-visible .checkmark-circle {
        animation: deposit-circle-draw 600ms var(--ease-out) forwards;
      }

      .checkmark-tick {
        stroke-dasharray: 60;
        stroke-dashoffset: 60;
      }

      #deposit-success-area.is-visible .checkmark-tick {
        animation: deposit-tick-draw 400ms var(--ease-out) 350ms forwards;
      }

      @keyframes deposit-check-pop {
        0%   { opacity: 0; transform: scale(0.3); }
        60%  { opacity: 1; transform: scale(1.08); }
        100% { opacity: 1; transform: scale(1); }
      }

      @keyframes deposit-circle-draw {
        to { stroke-dashoffset: 0; }
      }

      @keyframes deposit-tick-draw {
        to { stroke-dashoffset: 0; }
      }

      .deposit-confetti-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
      }

      /* ---- Site footer ---- */
      .site-footer {
        margin-top: var(--space-10);
        padding-top: var(--space-6);
        border-top: 1px solid var(--color-border-subtle);
        text-align: center;
        font-size: var(--text-sm);
        color: var(--color-text-muted);
      }

      .site-footer a {
        color: var(--color-text-accent);
        text-decoration: none;
      }

      .site-footer a:hover {
        text-decoration: underline;
      }

      .site-footer .sep {
        margin: 0 var(--space-2);
        color: var(--color-text-muted);
        opacity: 0.5;
      }

      /* ---- Reduced motion ---- */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- Vue mounts its fragment directly into body; global styles remain above. -->
    <script type="module" src="/src/pages/home.ts"></script>
  </body>
</html>
